add-student=Syntax: add-student n/NAME al/ACADEMIC_LEVEL [p/PHONE]\n\nExamples: add-student n/Mei Lin al/Sec 2 p/91234567\n\nValidation: Names are 1-80 characters, start/end with letters, and allow spaces, apostrophes, hyphens and periods between letters. Levels are Sec 1-5 or IP 1-6. Phones use the Singapore rule below.\n\nCommon errors: Duplicate normalized name and level; invalid fields; missing or repeated prefixes. Failed saving rolls back the addition.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
edit-student=Syntax: edit-student sid/STUDENT_ID [al/ACADEMIC_LEVEL] [p/PHONE]\n\nExamples: edit-student sid/S-0007 al/Sec 3 p/98765432\n\nValidation: Supply at least one of al/ or p/; both may be updated together, but neither may be empty. Levels are Sec 1-5 or IP 1-6. Student and guardian phones are independent.\n\nCommon errors: Unknown student; duplicate name and level; invalid phone. Failed saving restores the old record.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
delete-student=Syntax: delete-student sid/STUDENT_ID\n\nExamples: delete-student sid/S-0007\n\nValidation: Use an existing permanent ID. Removes the student, assignments and guardian link; retains guardian records.\n\nCommon errors: Unknown student or malformed parameters. Failed saving restores the record. Successful deletion is permanent.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
list-students=Syntax: list-students\n\nExamples: list-students\n\nValidation: No arguments. Restores every student and clears name, subject and level filters. Read-only; keeps the current workspace.\n\nCommon errors: Extra arguments are rejected.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
find-student=Syntax: find-student n/QUERY\n\nExamples: find-student n/Mei Lin\n\nValidation: One name query of 1-80 characters following name rules. Case-insensitive substring matching; multiple words form one phrase. Read-only.\n\nCommon errors: Invalid characters, empty/repeated/extra parameters. No matches leaves an empty list. Use list-students to reset.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
view-student=Syntax: view-student sid/STUDENT_ID\n\nExamples: view-student sid/S-0007\n\nValidation: Use an existing permanent ID. Reveals a hidden student and opens their profile. Read-only; select Students if another tab is open.\n\nCommon errors: Unknown student or malformed parameters.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
add-guardian=Syntax: add-guardian n/NAME p/PHONE\n\nExamples: add-guardian n/Anita Lim p/91234567\n\nValidation: Name rules match add-student. Phone must follow the Singapore rule below and be unique among guardians.\n\nCommon errors: Invalid fields or duplicate phone. Reuse an existing guardian for siblings. Failed saving rolls back the addition.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
list-guardians=Syntax: list-guardians\n\nExamples: list-guardians\n\nValidation: No arguments. Opens Guardians and clears guardian search. Select a row to see linked students. Read-only.\n\nCommon errors: Extra arguments are rejected. An empty register reports No guardians registered.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
find-guardian=Syntax: find-guardian n/QUERY\n\nExamples: find-guardian n/anita\n\nValidation: One name query of 1-80 characters following name rules. Case-insensitive substring; multiple words form one phrase. Searches names only and opens Guardians. Read-only.\n\nCommon errors: Invalid query or malformed parameters. No matches leaves an empty list. Use list-guardians to reset.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
edit-guardian=Syntax: edit-guardian gid/GUARDIAN_ID p/PHONE\n\nExamples: edit-guardian gid/G-0003 p/98765432\n\nValidation: Existing guardian ID and a valid Singapore phone. Updates the shared contact for every linked student.\n\nCommon errors: Unknown guardian, duplicate guardian phone or invalid fields. Failed saving restores the old number.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
link-guardian=Syntax: link-guardian sid/STUDENT_ID gid/GUARDIAN_ID\n\nExamples: link-guardian sid/S-0007 gid/G-0003\n\nValidation: Both records must exist. A student has at most one guardian; a guardian may be shared.\n\nCommon errors: Unknown records or an existing link. Unlink before replacing a guardian. Failed saving restores relationships.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
unlink-guardian=Syntax: unlink-guardian sid/STUDENT_ID\n\nExamples: unlink-guardian sid/S-0007\n\nValidation: Student must exist and have a guardian. Removes only the relationship, retaining both records and sibling links. Opens Students after success.\n\nCommon errors: Unknown student or no guardian to unlink. Failed saving restores the link.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
list-groups=Syntax: list-groups\n\nExamples: list-groups\n\nValidation: No arguments. Opens Groups and lists configured codes, labels and kinds. Read-only.\n\nCommon errors: Extra arguments are rejected. Group creation is not supported.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
assign-group=Syntax: assign-group sid/STUDENT_ID g/GROUP_CODE\n\nExamples: assign-group sid/S-0007 g/MAT\n\nValidation: Student and configured group must exist. Group codes ignore case. Distinct assignments are allowed.\n\nCommon errors: Unknown student/group or duplicate assignment. Failed saving restores previous assignments.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
unassign-group=Syntax: unassign-group sid/STUDENT_ID g/GROUP_CODE\n\nExamples: unassign-group sid/S-0007 g/MAT\n\nValidation: Student, configured group and assignment must exist. Removes only that assignment; the student is retained.\n\nCommon errors: Unknown student/group or missing assignment. Failed saving restores the assignment.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
filter-students=Syntax: filter-students g/GROUP_CODE OR filter-students al/ACADEMIC_LEVEL\n\nExamples: filter-students g/MAT; filter-students al/Sec 2\n\nValidation: Exactly one variant. Groups must be configured Subject groups, not Class groups. Levels are Sec 1-5 or IP 1-6. Opens Students and replaces the previous filter. Read-only.\n\nCommon errors: Unknown/Class group, invalid level or empty/repeated/mixed/extra parameters. No matches leaves an empty list. Use list-students to reset.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
help=Syntax: help [COMMAND]\n\nExamples: help; help add-student\n\nValidation: No argument lists all commands; one supported command name opens its help. Names ignore case. Read-only and available during recovery.\n\nCommon errors: Unknown command: No help is available. Multiple words: Invalid command format. The described command is never executed.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
exit=Syntax: exit\n\nExamples: exit\n\nValidation: Closes Mentora. Successful changes have already saved.\n\nCommon errors: Extra arguments are currently ignored. Normal saves are not atomic; keep backups.\n\nShared rules: Command/prefix casing is ignored. Each supplied prefix occurs once and has a nonempty value. IDs are uppercase S- or G- followed by at least four digits, never row positions.\nSingapore phones: 8 digits starting with 3, 6, 8 or 9, optionally prefixed by +65 with at most one space.
